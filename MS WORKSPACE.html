<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiple Sclerosis (HB38) Project Workspace</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap');

:root{
  --bg:#EEF1F8;
  --surface:#FFFFFF;
  --ink:#1B2440;
  --ink-light:#6B7793;
  --line:#E3E8F2;
  --line-soft:#EEF1F7;
  --brand:#5B5BF0;
  --brand-2:#8B3FE8;
  --brand-ink:#4B3FD6;
  --brand-soft:#EDEBFE;
  --grad:linear-gradient(135deg,#5B5BF0 0%,#8B3FE8 100%);
  --grad-soft:linear-gradient(135deg,#EEF0FE 0%,#F5EDFD 100%);
  --done:#0E9F6E;
  --done-bg:#DEF7EC;
  --pending:#C2730B;
  --pending-bg:#FDF2DC;
  --overdue:#E02424;
  --overdue-bg:#FCE8E8;
  --shadow-sm:0 1px 2px rgba(27,36,64,.06), 0 1px 3px rgba(27,36,64,.05);
  --shadow:0 4px 16px rgba(27,36,64,.08), 0 2px 6px rgba(27,36,64,.05);
  --shadow-lg:0 18px 50px rgba(27,36,64,.16), 0 6px 18px rgba(27,36,64,.08);
  --radius:14px;
  --font-sans:'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-display:'Space Grotesk', 'Plus Jakarta Sans', sans-serif;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-sans);
  font-size:14px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
#root{min-height:100vh;}
::selection{background:var(--brand-soft);}
*::-webkit-scrollbar{width:10px;height:10px;}
*::-webkit-scrollbar-thumb{background:#CDD5E6;border-radius:8px;border:2px solid var(--bg);}
*::-webkit-scrollbar-thumb:hover{background:#B6C0D8;}

/* ---- Loading / name gate ---- */
body:has(.gate){background:var(--grad);}
.gate{
  position:relative;
  max-width:420px;
  margin:9vh auto;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:20px;
  padding:38px 34px 34px;
  box-shadow:var(--shadow-lg);
  overflow:hidden;
}
.gate:before{content:'';position:absolute;top:0;left:0;right:0;height:6px;background:var(--grad);}
.gate h1{font-family:var(--font-display);font-weight:700;font-size:23px;margin:6px 0 6px;letter-spacing:-.02em;line-height:1.2;}
.gate p{color:var(--ink-light);margin:0 0 22px;font-size:13.5px;}
.gate input{
  width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:11px;
  font-family:var(--font-sans);font-size:14px;background:#FBFCFE;color:var(--ink);
  transition:border-color .15s, box-shadow .15s, background .15s;
}
.gate input:focus{outline:none;border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px var(--brand-soft);}
.gate button{margin-top:16px;}
.gate label{display:block;font-size:12px;font-weight:600;color:var(--ink);margin:16px 0 6px;}
.gate .err{color:var(--overdue);font-size:12.5px;margin-top:12px;min-height:16px;}
.gate .hint{font-size:11.5px;color:var(--ink-light);margin-top:18px;line-height:1.5;border-top:1px solid var(--line-soft);padding-top:14px;}
.signout{font-size:12px;color:rgba(255,255,255,.85);cursor:pointer;margin-top:8px;display:inline-block;font-weight:600;transition:color .15s;}
.signout:hover{color:#fff;}

/* ---- Layout ---- */
.app{display:flex;min-height:100vh;}
.sidebar{
  width:304px;flex-shrink:0;border-right:1px solid var(--line);
  background:var(--surface);display:flex;flex-direction:column;
}
.sidebar-head{padding:22px 22px 18px;background:var(--grad);color:#fff;}
.sidebar-head h1{font-family:var(--font-display);font-size:18px;font-weight:700;margin:0;line-height:1.28;letter-spacing:-.01em;color:#fff;}
.sidebar-head .who{color:rgba(255,255,255,.82);font-size:12px;margin-top:6px;font-weight:500;}
.tabs{display:flex;flex-wrap:wrap;background:var(--surface);border-bottom:1px solid var(--line-soft);padding:8px 10px;gap:4px;}
.tab{
  flex:1 1 44%;padding:9px 10px;text-align:center;cursor:pointer;color:var(--ink-light);
  font-size:12.5px;font-weight:600;border-radius:9px;transition:background .15s,color .15s;
}
.tab:hover{background:var(--bg);color:var(--ink);}
.tab.active{color:#fff;background:var(--grad);box-shadow:var(--shadow-sm);}
.meeting-list{flex:1;overflow-y:auto;}
.meeting-item{
  padding:14px 20px;border-bottom:1px solid var(--line-soft);cursor:pointer;
  border-left:3px solid transparent;transition:background .15s,border-color .15s;
}
.meeting-item:hover{background:var(--bg);}
.meeting-item.active{background:var(--brand-soft);border-left-color:var(--brand);}
.meeting-item .d{font-size:11.5px;color:var(--ink-light);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.meeting-item .t{font-family:var(--font-display);font-size:15px;font-weight:600;margin-top:3px;line-height:1.3;letter-spacing:-.01em;}
.meeting-item .cnt{font-size:11.5px;color:var(--ink-light);margin-top:5px;}
.new-btn{
  margin:14px 20px;padding:11px;border:none;background:var(--grad);
  color:#fff;border-radius:11px;cursor:pointer;font-size:13px;font-weight:700;font-family:var(--font-sans);
  text-align:center;box-shadow:var(--shadow-sm);transition:transform .12s, box-shadow .15s, opacity .15s;
}
.new-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow);}

.main{flex:1;overflow-y:auto;padding:40px 48px;max-width:860px;}
.empty{color:var(--ink-light);margin-top:80px;text-align:center;}

/* ---- Meeting detail ---- */
.mrow{display:flex;gap:16px;margin-bottom:18px;flex-wrap:wrap;}
.field{flex:1;min-width:180px;}
.field label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-light);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
.field input, .field textarea{
  width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;
  font-family:var(--font-sans);font-size:14px;background:#FBFCFE;color:var(--ink);
  transition:border-color .15s, box-shadow .15s, background .15s;
}
.field input:focus, .field textarea:focus{outline:none;border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px var(--brand-soft);}
.title-input{
  font-family:var(--font-display);font-size:28px;font-weight:700;border:none;background:none;
  width:100%;padding:0;margin-bottom:6px;color:var(--ink);letter-spacing:-.02em;line-height:1.2;
}
.title-input:focus{outline:none;}
.meta-line{color:var(--ink-light);font-size:12.5px;margin-bottom:22px;}
.section-label{
  font-size:11.5px;font-weight:700;color:var(--brand-ink);margin:30px 0 12px;text-transform:uppercase;letter-spacing:.07em;
  border-bottom:1px solid var(--line-soft);padding-bottom:9px;
}
textarea.notes{min-height:140px;resize:vertical;line-height:1.65;}

.ai-row{
  display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-soft);
}
.ai-check{
  width:20px;height:20px;border:2px solid #CBD3E3;border-radius:7px;margin-top:1px;
  flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:border-color .15s, background .15s;
}
.ai-check:hover{border-color:var(--done);}
.ai-check.done{background:var(--done);border-color:var(--done);color:#fff;font-size:13px;}
.ai-task{flex:1;font-size:14px;}
.ai-task.done{color:var(--ink-light);text-decoration:line-through;}
.ai-meta{display:flex;gap:8px;align-items:center;flex-shrink:0;}
.ai-owner{
  font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;background:var(--brand-soft);
  border:none;color:var(--brand-ink);
}
.ai-due{font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;}
.ai-due.pending{background:var(--pending-bg);color:var(--pending);}
.ai-due.overdue{background:var(--overdue-bg);color:var(--overdue);}
.ai-due.done{background:var(--done-bg);color:var(--done);}
.ai-del{color:#AEB7CC;cursor:pointer;font-size:15px;padding:0 4px;transition:color .15s;}
.ai-del:hover{color:var(--overdue);}

.add-ai{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
.add-ai input, .add-ai select{
  border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13px;
  font-family:var(--font-sans);background:#FBFCFE;color:var(--ink);transition:border-color .15s, box-shadow .15s, background .15s;
}
.add-ai input:focus, .add-ai select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft);background:#fff;}
.add-ai input[type=text]{flex:1;min-width:180px;}
.add-ai button{
  border:none;background:var(--ink);color:#fff;
  border-radius:10px;padding:9px 16px;cursor:pointer;font-size:13px;font-weight:600;transition:opacity .15s, transform .12s;
}
.add-ai button:hover{opacity:.88;transform:translateY(-1px);}
.del-meeting{color:var(--ink-light);font-size:12.5px;cursor:pointer;margin-top:32px;display:inline-block;font-weight:600;transition:color .15s;}
.del-meeting:hover{color:var(--overdue);}

/* ---- Action items overview ---- */
.overview-filters{display:flex;gap:8px;margin-bottom:20px;}
.overview-filters select{
  border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;
  font-family:var(--font-sans);background:var(--surface);color:var(--ink);cursor:pointer;transition:border-color .15s;
}
.overview-filters select:focus{outline:none;border-color:var(--brand);}
.ov-group{margin-bottom:26px;}
.ov-group h3{font-family:var(--font-display);font-size:13px;font-weight:700;margin:0 0 8px;color:var(--ink-light);text-transform:uppercase;letter-spacing:.05em;}
.ov-row{
  display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line-soft);
}
.ov-row .src{font-size:11.5px;color:var(--ink-light);margin-top:2px;}
button.plain{background:none;border:none;cursor:pointer;font-family:var(--font-sans);}

/* ---- Literature / Resources ---- */
.lib-add{
  background:var(--grad-soft);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;margin-bottom:28px;
}
.lib-add .mrow{margin-bottom:12px;}
.lib-add .mrow:last-child{margin-bottom:0;}
.lib-add-title{font-size:12px;font-weight:700;color:var(--brand-ink);margin-bottom:12px;text-transform:uppercase;letter-spacing:.05em;}
.lib-cat{margin-bottom:24px;}
.lib-cat h3{
  font-family:var(--font-display);font-size:16px;font-weight:700;margin:0 0 6px;
  color:var(--ink);letter-spacing:-.01em;
}
.lib-row{
  display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid var(--line-soft);
}
.lib-main{flex:1;min-width:0;}
.lib-title{font-size:14px;font-weight:600;}
.lib-title a{color:var(--brand-ink);text-decoration:none;border-bottom:1px solid transparent;transition:border-color .15s;}
.lib-title a:hover{border-bottom-color:var(--brand-ink);}
.lib-sub{font-size:12px;color:var(--ink-light);margin-top:3px;}
.lib-notes{font-size:12.5px;color:var(--ink-light);margin-top:6px;line-height:1.55;}
.lib-tag{
  font-size:10.5px;font-weight:600;padding:4px 10px;border-radius:20px;background:var(--brand-soft);
  border:none;color:var(--brand-ink);flex-shrink:0;margin-top:1px;text-transform:uppercase;letter-spacing:.03em;
}
.lib-del{color:#AEB7CC;cursor:pointer;font-size:15px;padding:0 4px;flex-shrink:0;transition:color .15s;}
.lib-del:hover{color:var(--overdue);}

/* ---- Home overview ---- */
.hello{font-family:var(--font-display);font-size:28px;font-weight:700;margin:0 0 4px;letter-spacing:-.02em;}
.cards{display:flex;flex-wrap:wrap;gap:16px;margin:10px 0 30px;}
.card{
  flex:1 1 150px;min-width:150px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm);
  position:relative;overflow:hidden;transition:transform .14s, box-shadow .18s, border-color .15s;
}
.card .num{font-family:var(--font-display);font-size:34px;font-weight:700;line-height:1;color:var(--brand-ink);letter-spacing:-.02em;}
.card .lbl{font-size:12px;color:var(--ink-light);margin-top:8px;font-weight:500;}
.card.click{cursor:pointer;}
.card.click:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#CFD6E8;}
.card.warn .num{color:var(--overdue);}
.card.good .num{color:var(--done);}

/* ---- Timeline ---- */
.tl{position:relative;margin-top:12px;padding-left:10px;border-left:2px solid var(--line);}
.tl-item{position:relative;padding:0 0 24px 22px;}
.tl-item:before{
  content:'';position:absolute;left:-7px;top:3px;width:12px;height:12px;border-radius:50%;
  background:var(--surface);border:2px solid var(--ink-light);box-shadow:0 0 0 3px var(--bg);
}
.tl-item.meeting:before{background:var(--brand);border-color:var(--brand);}
.tl-item.overdue:before{background:var(--overdue);border-color:var(--overdue);}
.tl-item.due:before{background:var(--pending);border-color:var(--pending);}
.tl-date{font-size:11.5px;color:var(--ink-light);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.tl-title{font-size:14px;font-weight:600;margin-top:3px;}
.tl-sub{font-size:12px;color:var(--ink-light);margin-top:2px;}

/* ---- Signup toggle on the gate ---- */
.gate .switch{font-size:12.5px;color:var(--ink-light);margin-top:18px;}
.gate .switch a{color:var(--brand-ink);cursor:pointer;font-weight:600;border-bottom:1px solid transparent;}
.gate .switch a:hover{border-bottom-color:var(--brand-ink);}
.gate .ok{color:var(--done);font-size:12.5px;margin-top:12px;min-height:16px;}

/* ---- File attachments ---- */
.attach-wrap{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.attach-chip{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;background:var(--bg);
  border:1px solid var(--line);border-radius:20px;padding:4px 8px 4px 12px;max-width:100%;
}
.attach-chip a{
  color:var(--ink);text-decoration:none;max-width:200px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;
}
.attach-chip a:hover{text-decoration:underline;}
.attach-chip .x{cursor:pointer;color:var(--ink-light);font-size:13px;}
.attach-chip .x:hover{color:var(--overdue);}
.attach-btn{
  font-size:12px;font-weight:600;color:var(--ink-light);cursor:pointer;border:1px dashed #C6CEE0;
  border-radius:20px;padding:4px 12px;background:none;font-family:var(--font-sans);transition:border-color .15s, color .15s;
}
.attach-btn:hover{border-color:var(--brand);color:var(--brand-ink);}
.attach-btn[disabled]{opacity:.5;cursor:default;}

/* ---- Notifications bell ---- */
.bell{position:relative;cursor:pointer;font-size:18px;line-height:1;flex-shrink:0;}
.bell .dot{
  position:absolute;top:-6px;right:-8px;background:#fff;color:var(--overdue);font-size:10px;
  min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;padding:0 4px;font-family:var(--font-sans);font-weight:700;box-shadow:var(--shadow-sm);
}
.notif-panel{background:var(--brand-soft);border-bottom:1px solid var(--line-soft);padding:14px 20px;}
.notif-panel h4{margin:0 0 8px;font-size:11px;color:var(--brand-ink);font-weight:700;text-transform:uppercase;letter-spacing:.05em;}
.notif-item{font-size:13px;padding:8px 0;border-bottom:1px solid rgba(91,91,240,.12);cursor:pointer;}
.notif-item:last-child{border-bottom:none;}
.notif-item:hover{color:var(--brand-ink);}
.notif-empty{font-size:13px;color:var(--ink-light);}

/* ---- Mobile / small screens ---- */
@media (max-width:720px){
  .app{flex-direction:column;min-height:auto;}
  .sidebar{width:100%;border-right:none;border-bottom:1px solid var(--line);}
  .sidebar-head{padding:18px 16px 14px;}
  .sidebar-head h1{font-size:16px;}
  .meeting-list{max-height:320px;}
  .main{padding:22px 16px;max-width:none;}
  .title-input{font-size:23px;}
  .hello{font-size:23px;}
  .card{flex:1 1 44%;min-width:130px;padding:16px;}
  .card .num{font-size:28px;}
  .gate{margin:5vh 14px;padding:30px 22px;}
  .ai-meta{flex-wrap:wrap;justify-content:flex-end;}
  .notif-panel{padding:12px 16px;}
  /* 16px inputs stop iOS Safari from auto-zooming on focus */
  .field input,.field textarea,.gate input,.add-ai input,.add-ai select,
  .overview-filters select{font-size:16px;}
}
</style>
</head>

<script>
/* Show any script error on the page instead of failing to a blank screen. */
window.addEventListener('error', function(ev){
  try{
    var r = document.getElementById('root');
    if(r){
      r.innerHTML = '<div class="gate"><h1>Something went wrong</h1>'
        + '<p>The dashboard hit an error while loading. Please send this message to the admin:</p>'
        + '<pre style="white-space:pre-wrap;font-size:12px;color:#A6483C;background:#F3E4E1;padding:12px;border-radius:4px;">'
        + String(ev.message || ev.error || 'Unknown error')
        + '</pre></div>';
    }
  }catch(e){}
});
</script>
<script>
(function(){

/* ------------------------------------------------------------
   Backend API client. Authentication and ALL workspace data
   live on the server (see server.js), so the 4 accounts share
   ONE workspace. The login token is kept in localStorage so a
   refresh stays signed in (with an in-memory fallback).
   To change who can log in, edit DEFAULT_USERS in server.js.
   ------------------------------------------------------------ */
const TokenStore = (function(){
  let mem = null;
  return {
    get(){ try{ return localStorage.getItem('ms_token'); }catch(e){ return mem; } },
    set(t){ mem = t; try{ if(t) localStorage.setItem('ms_token', t); else localStorage.removeItem('ms_token'); }catch(e){} }
  };
})();

const API = {
  async login(username, password){
    const r = await fetch('/api/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ username, password })
    });
    if(r.status === 429) return { locked:true };
    if(!r.ok) return null;
    return await r.json(); // { token, name }
  },
  async getData(){
    const t = TokenStore.get();
    const r = await fetch('/api/data', { headers: t ? {'Authorization':'Bearer '+t} : {} });
    if(r.status === 401){ TokenStore.set(null); return { unauthorized:true }; }
    if(!r.ok) throw new Error('Could not load workspace (HTTP '+r.status+')');
    return await r.json(); // { name, data }
  },
  async saveData(data){
    const t = TokenStore.get();
    const r = await fetch('/api/data', {
      method:'PUT',
      headers: Object.assign({'Content-Type':'application/json'}, t ? {'Authorization':'Bearer '+t} : {}),
      body: JSON.stringify({ data })
    });
    if(r.status === 401){ TokenStore.set(null); return false; }
    return r.ok;
  },
  async signup(payload){
    const r = await fetch('/api/signup', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    const j = await r.json().catch(()=>({}));
    return Object.assign({ ok:r.ok, status:r.status }, j); // {ok, token?, name?, error?}
  },
  async uploadFile(file){
    const dataUrl = await new Promise((resolve, reject)=>{
      const fr = new FileReader();
      fr.onload = ()=>resolve(fr.result);
      fr.onerror = ()=>reject(new Error('Could not read the file.'));
      fr.readAsDataURL(file);
    });
    const t = TokenStore.get();
    const r = await fetch('/api/upload', {
      method:'POST',
      headers: Object.assign({'Content-Type':'application/json'}, t ? {'Authorization':'Bearer '+t} : {}),
      body: JSON.stringify({ name:file.name, dataUrl })
    });
    const j = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error || ('Upload failed (HTTP '+r.status+')'));
    return j; // { id, name, size }
  }
};

function patchData(d){
  d = d || {};
  if(!Array.isArray(d.members))    d.members = [];
  if(!Array.isArray(d.meetings))   d.meetings = [];
  if(!Array.isArray(d.literature)) d.literature = [];
  if(!Array.isArray(d.resources))  d.resources = [];
  return d;
}

const root = document.getElementById('root');
let state = {
  loading: true,
  userName: null,
  loadError: null,
  data: null, // { members: [], meetings: [], literature: [], resources: [] }
  activeTab: 'home',
  activeMeetingId: null,
  ovOwnerFilter: 'all',
  ovStatusFilter: 'open',
  authMode: 'login',  // 'login' | 'signup'
  showNotif: false
};

function uid(){ return Math.random().toString(36).slice(2,10); }
function todayStr(){ return new Date().toISOString().slice(0,10); }

function seedData(){
  return {
    members: ['Anjana','Richa','Rakesh','Thangaraj','Nachammai','Supriti','Easha'],
    literature: [],
    resources: [],
    meetings: [
      {
        id: uid(),
        date: '2026-08-21',
        title: 'HB38 — SPMS Histopathological Mapping | Discussion with Dr Stephanie Zandee',
        attendees: 'Stephanie, Richa, Anjana, Easha',
        notes:
`Time: 6:30 PM – 7:30 PM IST · Mode: Video call · Prepared by: Anjana

Background

function render(){
  root.innerHTML = '';
  if(state.loading){
    root.appendChild(el('div',{class:'gate'},[el('p',{},['Loading…'])]));
    return;
  }
  if(state.loadError){
    root.appendChild(renderError());
    return;
  }
  if(!state.userName){
    root.appendChild(renderGate());
    return;
  }
  root.appendChild(renderApp());
}

function renderError(){
  return el('div',{class:'gate'},[
    el('h1',{},['Cannot reach the workspace server']),
    el('p',{},[state.loadError || 'The server may be offline. Make sure server.js is running.']),
    el('button',{class:'new-btn',style:'display:inline-block;margin-top:6px;padding:9px 16px;',
      onclick:()=>{ state.loadError=null; state.loading=true; render(); loadAll(); }},['Try again'])
  ]);
}

function el(tag, attrs, children){
  const e = document.createElement(tag);
  attrs = attrs || {};
  for(const k in attrs){
    if(k === 'class') e.className = attrs[k];
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else if(k === 'html') e.innerHTML = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  (children||[]).forEach(c=>{
    if(c === null || c === undefined) return;
    if(typeof c === 'string') e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  });
  return e;
}

// ---------- storage (server-backed) ----------
async function loadAll(){
  state.loadError = null;
  if(!TokenStore.get()){ state.loading = false; render(); return; }
  try{
    const res = await API.getData();
    if(res.unauthorized){ state.userName = null; state.loading = false; render(); return; }
    state.userName = res.name;
    state.data = patchData(res.data);
  }catch(e){
    state.loadError = e.message || 'Could not reach the server.';
  }
  state.loading = false;
  render();
}

async function saveData(){
  if(!state.data) return;
  try{ await API.saveData(state.data); }
  catch(e){ console.error('save failed', e); }
}

async function login(username, password){
  state.loadError = null;
  let res;
  try{ res = await API.login(username, password); }
  catch(e){ state.loadError = 'Could not reach the server. Is server.js running?'; render(); return true; }
  if(res && res.locked) return 'locked';
  if(!res || !res.token) return false;
  TokenStore.set(res.token);
  state.userName = res.name;
  try{
    const d = await API.getData();
    if(!d.unauthorized) state.data = patchData(d.data);
  }catch(e){ state.loadError = e.message; }
  state.activeTab = 'home';
  render();
  return true;
}

async function signUp(payload){
  state.loadError = null;
  let res;
  try{ res = await API.signup(payload); }
  catch(e){ return { error:'Could not reach the server. Please try again.' }; }
  if(res.status === 429) return { error:'Too many attempts. Please wait 15 minutes and try again.' };
  if(!res.ok || !res.token) return { error: res.error || 'Could not create the account.' };
  TokenStore.set(res.token);
  state.userName = res.name;
  try{
    const d = await API.getData();
    if(!d.unauthorized) state.data = patchData(d.data);
  }catch(e){ state.loadError = e.message; }
  state.activeTab = 'home';
  render();
  return { ok:true };
}

async function signOut(){
  TokenStore.set(null);
  state.userName = null;
  state.data = null;
  state.activeMeetingId = null;
  state.activeTab = 'home';
  state.showNotif = false;
  render();
}

function renderGate(){
  return state.authMode === 'signup' ? renderSignupGate() : renderLoginGate();
}

function renderLoginGate(){
  const userInput = el('input',{placeholder:'username', autocomplete:'username'});
  const passInput = el('input',{type:'password', placeholder:'password', autocomplete:'current-password'});
  const errEl = el('div',{class:'err'},['']);

  async function submit(){
    errEl.textContent = '';
    const ok = await login(userInput.value, passInput.value);
    if(ok === 'locked'){
      errEl.textContent = 'Too many failed attempts. Please wait 15 minutes and try again.';
      passInput.value = '';
    } else if(!ok){
      errEl.textContent = 'Incorrect username or password.';
      passInput.value = '';
      passInput.focus();
    }
  }
  userInput.addEventListener('keydown',(e)=>{ if(e.key==='Enter') passInput.focus(); });
  passInput.addEventListener('keydown',(e)=>{ if(e.key==='Enter') submit(); });

  const gate = el('div',{class:'gate'},[
    el('h1',{},['Multiple Sclerosis (HB38) Project Workspace']),
    el('p',{},['Sign in to continue.']),
    el('label',{},['Username']),
    userInput,
    el('label',{},['Password']),
    passInput,
    el('div',{},[ el('button',{class:'new-btn',style:'display:inline-block;margin-top:14px;padding:9px 16px;',onclick:submit},['Sign in']) ]),
    errEl,
    el('div',{class:'switch'},[
      'New to the team? ',
      el('a',{onclick:()=>{ state.authMode='signup'; render(); }},['Create an account'])
    ])
  ]);
  setTimeout(()=>userInput.focus(), 0);
  return gate;
}

function renderSignupGate(){
  const nameInput = el('input',{placeholder:'e.g. Anjana', autocomplete:'name'});
  const userInput = el('input',{placeholder:'lowercase, e.g. anjana', autocomplete:'username'});
  const emailInput = el('input',{type:'email', placeholder:'you@example.com', autocomplete:'email'});
  const passInput = el('input',{type:'password', placeholder:'at least 8 characters', autocomplete:'new-password'});
  const codeInput = el('input',{placeholder:'ask the project admin', autocomplete:'off'});
  const errEl = el('div',{class:'err'},['']);

  async function submit(){
    errEl.textContent = '';
    const res = await signUp({
      name: nameInput.value.trim(),
      username: userInput.value.trim().toLowerCase(),
      email: emailInput.value.trim(),
      password: passInput.value,
      code: codeInput.value
    });
    if(res && res.error){ errEl.textContent = res.error; }
  }
  // auto-suggest a username from the name
  nameInput.addEventListener('input', ()=>{
    if(!userInput.dataset.touched)
      userInput.value = nameInput.value.trim().toLowerCase().replace(/[^a-z0-9_]+/g,'');
  });
  userInput.addEventListener('input', ()=>{ userInput.dataset.touched = '1'; });
  passInput.addEventListener('keydown',(e)=>{ if(e.key==='Enter') submit(); });

  const gate = el('div',{class:'gate'},[
    el('h1',{},['Create your account']),
    el('p',{},['Join the HB38 project workspace.']),
    el('label',{},['Full name']),        nameInput,
    el('label',{},['Username']),          userInput,
    el('label',{},['Email (for task & deadline alerts)']), emailInput,
    el('label',{},['Password']),          passInput,
    el('label',{},['Team access code']),  codeInput,
    el('div',{},[ el('button',{class:'new-btn',style:'display:inline-block;margin-top:14px;padding:9px 16px;',onclick:submit},['Create account']) ]),
    errEl,
    el('div',{class:'switch'},[
      'Already have an account? ',
      el('a',{onclick:()=>{ state.authMode='login'; render(); }},['Sign in'])
    ])
  ]);
  setTimeout(()=>nameInput.focus(), 0);
  return gate;
}

  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString(undefined,{month:'short', day:'numeric', year:'numeric'});
}

function dueClass(ai){

}

// ---------- file attachments ----------
function fileHref(att, dl){
  return '/api/file/' + att.id + '?t=' + encodeURIComponent(TokenStore.get()||'') + (dl ? '&dl=1' : '');
}

function attachButton(item){
  const btn = el('button',{class:'attach-btn'},['📎 Attach file']);
  btn.addEventListener('click', ()=>{
    const inp = el('input',{type:'file'});
    inp.style.display = 'none';
    document.body.appendChild(inp);
    inp.addEventListener('change', async ()=>{
      const f = inp.files && inp.files[0];
      document.body.removeChild(inp);
      if(!f) return;
      btn.textContent = 'Uploading…'; btn.disabled = true;
      try{
        const meta = await API.uploadFile(f);
        if(!Array.isArray(item.attachments)) item.attachments = [];
        item.attachments.push({ id:meta.id, name:meta.name, size:meta.size });
        saveData(); render();
      }catch(e){
        btn.textContent = '📎 Attach file'; btn.disabled = false;
        alert('Upload failed: ' + e.message);
      }
    });
    inp.click();
  });
  return btn;
}

function renderAttachments(item, opts){
  opts = opts || {};
  const list = item.attachments || [];
  if(opts.noAdd && list.length === 0) return null;   // nothing to show in read-only views
  const wrap = el('div',{class:'attach-wrap'});
  list.forEach(att=>{
    const chip = el('span',{class:'attach-chip'},[
      el('a',{href:fileHref(att), target:'_blank', rel:'noopener', title:att.name},[att.name])
    ]);
    if(!opts.noAdd){
      chip.appendChild(el('span',{class:'x', title:'Remove', onclick:()=>{
        if(!confirm('Remove "' + att.name + '"? (It stays until you save.)')) return;
        item.attachments = (item.attachments||[]).filter(a=>a.id!==att.id);
        saveData(); render();
      }},['✕']));
    }
    wrap.appendChild(chip);
  });
  if(!opts.noAdd) wrap.appendChild(attachButton(item));
  return wrap;
}

function renderActionItemRow(meeting, ai){

    ai.status = ai.status==='done' ? 'open' : 'done';
    saveData(); render();
  }}, [ai.status==='done' ? '✓' : '']);
  row.appendChild(check);
  const taskCell = el('div',{style:'flex:1;min-width:0;'},[
    el('div',{class:'ai-task' + (ai.status==='done'?' done':'')},[ai.task]),
    renderAttachments(ai)
  ]);
  row.appendChild(taskCell);
  const meta = el('div',{class:'ai-meta'});
  if(ai.owner) meta.appendChild(el('span',{class:'ai-owner'},[ai.owner]));
  if(ai.dueDate) meta.appendChild(el('span',{class:'ai-due ' + dueClass(ai)},[formatDate(ai.dueDate)]));
  meta.appendChild(el('span',{class:'ai-del', onclick:()=>{
    meeting.actionItems = meeting.actionItems.filter(x=>x.id!==ai.id);
    saveData(); render();
  }},['✕']));
  row.appendChild(meta);
  holder.appendChild(row);
  return holder;

    ownerSelect.appendChild(el('option',{value:mem},[mem]));
  });

  const addBtn = el('button',{onclick:()=>{

      id: uid(),

      status: 'open'
    });

    render();

}

// ---------- shared: collect all action items ----------
function allActionItems(){
  const out = [];
  state.data.meetings.forEach(m=>{
    (m.actionItems||[]).forEach(ai=>out.push({ ai, meeting:m }));
  });
  return out;
}

function taskRow(ai, meeting){
  const row = el('div',{class:'ov-row'});
  const check = el('div',{class:'ai-check' + (ai.status==='done'?' done':''), onclick:()=>{
    ai.status = ai.status==='done' ? 'open' : 'done';
    saveData(); render();
  }}, [ai.status==='done' ? '✓' : '']);
  row.appendChild(check);
  const mid = el('div',{style:'flex:1;min-width:0;'},[
    el('div',{class:'ai-task' + (ai.status==='done'?' done':'')},[ai.task]),
    el('div',{class:'src'},['From: ' + (meeting.title || 'Untitled') + ' · ' + formatDate(meeting.date)]),
    renderAttachments(ai, {noAdd:true})
  ]);
  row.appendChild(mid);
  const meta = el('div',{class:'ai-meta'});
  if(ai.owner) meta.appendChild(el('span',{class:'ai-owner'},[ai.owner]));
  if(ai.dueDate) meta.appendChild(el('span',{class:'ai-due ' + dueClass(ai)},[formatDate(ai.dueDate)]));
  row.appendChild(meta);
  return row;
}

// ---------- Home / overview ----------
function renderHome(){
  const wrap = el('div',{});

  wrap.appendChild(el('div',{style:'color:var(--ink-light);margin:0 0 18px;'},
    ['Here’s where the HB38 project stands today.']));

  const all      = allActionItems();
  const mineOpen = all.filter(x=>x.ai.owner===state.userName && x.ai.status!=='done');
  const teamOpen = all.filter(x=>x.ai.status!=='done');
  const overdue  = teamOpen.filter(x=>x.ai.dueDate && x.ai.dueDate < todayStr());
  const doneCnt  = all.filter(x=>x.ai.status==='done').length;

  const cards = el('div',{class:'cards'});
  cards.appendChild(el('div',{class:'card click', onclick:()=>{state.activeTab='mytasks';render();}},[
    el('div',{class:'num'},[String(mineOpen.length)]), el('div',{class:'lbl'},['Your open tasks'])
  ]));
  cards.appendChild(el('div',{class:'card click', onclick:()=>{state.activeTab='actions';render();}},[

  ]));
  cards.appendChild(el('div',{class:'card warn'},[
    el('div',{class:'num'},[String(overdue.length)]), el('div',{class:'lbl'},['Overdue (team)'])
  ]));
  cards.appendChild(el('div',{class:'card good'},[
    el('div',{class:'num'},[String(doneCnt)]), el('div',{class:'lbl'},['Completed'])
  ]));
  wrap.appendChild(cards);

  // upcoming (or most recent) meeting
  const meetings = [...state.data.meetings].sort((a,b)=>a.date.localeCompare(b.date));
  const future   = meetings.filter(m=>m.date >= todayStr());
  const nextM    = future.length ? future[0] : (meetings.length ? meetings[meetings.length-1] : null);
  if(nextM){
    wrap.appendChild(el('div',{class:'section-label'},[future.length ? 'Upcoming meeting' : 'Most recent meeting']));
    wrap.appendChild(el('div',{class:'card', style:'cursor:pointer;', onclick:()=>{
      state.activeTab='minutes'; state.activeMeetingId=nextM.id; render();
    }},[
      el('div',{class:'tl-date'},[formatDate(nextM.date)]),
      el('div',{class:'tl-title'},[nextM.title || 'Untitled meeting']),
      nextM.attendees ? el('div',{class:'tl-sub'},['Attendees: ' + nextM.attendees]) : null
    ]));
  }

  // your tasks preview
  wrap.appendChild(el('div',{class:'section-label'},['Your tasks']));
  if(mineOpen.length === 0){
    wrap.appendChild(el('div',{style:'color:var(--ink-light);'},['You have no open action items. 🎉']));
  } else {
    const sorted = [...mineOpen].sort((a,b)=>(a.ai.dueDate||'9999').localeCompare(b.ai.dueDate||'9999'));
    const list = el('div',{});
    sorted.slice(0,6).forEach(({ai,meeting})=>list.appendChild(taskRow(ai,meeting)));
    wrap.appendChild(list);
    if(sorted.length > 6){
      wrap.appendChild(el('span',{class:'signout', style:'color:var(--ink);margin-top:12px;',
        onclick:()=>{state.activeTab='mytasks';render();}},['View all ' + sorted.length + ' of your tasks →']));
    }

  return wrap;
}

// ---------- Timeline ----------
function renderTimeline(){
  const wrap = el('div',{});
  wrap.appendChild(el('div',{class:'section-label', style:'margin-top:0;'},['Project timeline']));
  wrap.appendChild(el('div',{style:'color:var(--ink-light);font-size:13px;margin:-4px 0 18px;'},
    ['Meetings and action-item deadlines in date order. A data-driven GM/WM damage-trajectory chart can be added here once lesion measurements are entered.']));

  const events = [];
  state.data.meetings.forEach(m=>{
    events.push({ date:m.date, type:'meeting', title:m.title||'Untitled meeting',
      sub: m.attendees ? 'Attendees: '+m.attendees : '', id:m.id });
    (m.actionItems||[]).forEach(ai=>{

        const t = (ai.status!=='done' && ai.dueDate < todayStr()) ? 'overdue' : 'due';

  events.sort((a,b)=>a.date.localeCompare(b.date));

  events.forEach(ev=>{
    const item = el('div',{class:'tl-item ' + ev.type});
    item.appendChild(el('div',{class:'tl-date'},[
      formatDate(ev.date) + (ev.type==='meeting' ? ' · Meeting' : ' · Due')
    ]));
    const title = ev.type==='meeting'
      ? el('div',{class:'tl-title', style:'cursor:pointer;', onclick:()=>{
          state.activeTab='minutes'; state.activeMeetingId=ev.id; render();
        }},[ev.title])
      : el('div',{class:'tl-title'},[ev.title]);
    item.appendChild(title);
    if(ev.sub) item.appendChild(el('div',{class:'tl-sub'},[ev.sub]));
    tl.appendChild(item);
  });
  wrap.appendChild(tl);
  return wrap;
}

// ---------- shared helper: group by category ----------
function groupByCategory(items){
  const groups = {};
  items.forEach(it=>{
    const cat = (it.category || '').trim() || 'Uncategorized';
    if(!groups[cat]) groups[cat] = [];
    groups[cat].push(it);
  });
  const names = Object.keys(groups).sort((a,b)=>{
    if(a==='Uncategorized') return 1;
    if(b==='Uncategorized') return -1;
    return a.localeCompare(b);
  });
  return names.map(name=>({ name, items: groups[name] }));
}

function normalizeLink(url){
  if(!url) return '';
  if(!/^https?:\/\//i.test(url)) return 'https://' + url;
  return url;
}

function renderLiteratureRow(lit){

  if(subParts.length) main.appendChild(el('div',{class:'lib-sub'},[subParts.join(' · ')]));

  main.appendChild(renderAttachments(lit));
  row.appendChild(main);
  row.appendChild(el('span',{class:'lib-del', onclick:()=>{
    state.data.literature = state.data.literature.filter(x=>x.id!==lit.id);
    saveData(); render();
  }},['✕']));
  return row;
}

/*
  ------------------------------------------------------------------
  HOW THIS RUNS
  ------------------------------------------------------------------
  This page talks to a small backend (server.js). Passwords are
  hashed on the server, and ALL workspace data is stored on the
  server (data.json), so the 4 accounts share ONE workspace.

  Start it with:   node server.js
  Then open:       http://localhost:8000/
  Change a pw:     node server.js set-password <username> <newpw>

  Note: saving is last-write-wins on the whole workspace. Fine for a
  small team; if two people edit the very same item at the same
  second, the last save wins. Refresh to pull the latest.
